name: C line text alert
on:
  schedule:
    # GitHub cron is UTC only. Two entries each so it fires in BOTH PST and PDT;
    # the script skips the one that doesn't match the Davis local hour.
    - cron: "30 15 * * 1-5"   # 7:30 AM PST
    - cron: "30 14 * * 1-5"   # 7:30 AM PDT
    - cron: "30 23 * * 1-5"   # 3:30 PM PST
    - cron: "30 22 * * 1-5"   # 3:30 PM PDT
  workflow_dispatch: {}   # lets you run it manually from the Actions tab or phone
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python c_line_alert.py --send --only-at-hours 7,15
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TO_PHONE: ${{ secrets.TO_PHONE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
